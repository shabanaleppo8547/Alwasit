<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خادم مركز الوسيط</title>
<style>body{font-family:system-ui,sans-serif;background:#14213D;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}
main{padding:24px;max-width:420px}h1{color:#E3A72F;margin:.2em 0}#s{margin-top:16px;padding:12px;border-radius:12px;background:#ffffff14}</style></head>
<body><main><div style="font-size:56px">👑</div><h1>خادم مركز الوسيط</h1>
<p>هذا الخادم يغذّي تطبيق المركز بمواعيد المحاضرات.</p><div id="s">جارٍ الفحص…</div></main>
<script>
fetch('/api/schedule',{cache:'no-store'}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
document.getElementById('s').textContent = ok ? '✅ يعمل — عدد المحاضرات: '+j.lectures.length : '⚠️ '+(j.error||'خطأ');
}).catch(()=>{document.getElementById('s').textContent='⚠️ تعذّر الاتصال';});
</script></body></html>
