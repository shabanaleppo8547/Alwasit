name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android/iOS platform files
        run: flutter create --org com.alwasit --project-name alwasit_center --platforms android,ios .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: |
          API_URL="$(tr -d '[:space:]' < ../api_url.txt)"
          echo "API_BASE_URL=$API_URL"
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../alwasit.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../alwasit-old-phones.apk
          ls -la ../*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alwasit-apk
          path: |
            alwasit.apk
            alwasit-old-phones.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مركز الوسيط - نسخة ${{ github.run_number }}
          body: |
            حمّل alwasit.apk (لمعظم الهواتف).
            إذا لم يُثبَّت على هاتف قديم، حمّل alwasit-old-phones.apk.
          files: |
            alwasit.apk
            alwasit-old-phones.apk
          make_latest: true
